name: CI - Lint, Test & Validate Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Ruff Lint + Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync

      - name: Run Code Quality & Linting (Ruff)
        run: uv run ruff check app tests

      - name: Run Unit & Integration Test Suite
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: "my-vertexai-project-id"
          GOOGLE_CLOUD_LOCATION: "global"
        run: uv run pytest tests/unit tests/integration -v
